[Settings]

// AlphaLoader v1.0 Settings
// Home : http://magic-sxe.blogspot.com
// Email: magic.sxe@gmail.com
//-------------------------------------


// Process Name to Search and Inject (Default is: hl.exe)
//-------------------------------------------------------

ProcessName=hl.exe


// Terminating Process on Starting Loader:
//  Good for Terminating crashed Game from memory
//  0 Disable (Default)
//  1 Enable
//-----------------------------------------------

TerminateProcess=0


// Module Name to Injecting (Default is: ALoader.dll)
//  Running if Module extention is: COM,EXE,BAT,CMD
//  Injecting if Module extention is: DLL
//---------------------------------------------------

ModuleName=Application.dll


// Loading Methods:
//  0 After Game Fully Loaded
//  1 Befor Game Fully Loaded
//  2 Very Fast Loading (Default)
//-------------------------------

LoadMethod=1


// Run As Administrator:
//  0 Disable (Default)
//  1 Enable
//----------------------

RunAsAdmin=0


// Show Output Console:
//  0 Hidden
//  1 Show (Default)
//---------------------

ShowConsole=1

